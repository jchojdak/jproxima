name: CI Unit tests

on:
  push:
    branches:
      - master
      - feature/**
      - release/**
      - fix/**
      - refactor/**
      - test/**

  pull_request:
    branches:
      - master
      - feature/**
      - release/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp clean test